# Example ALLSEER daemon configuration.
#
# Every value here is a recommended starting point, not the eventual one. The
# defaults are conservative in what they enforce (monitor mode) and strict in
# what they observe (fail-closed on telemetry loss), because a governance system
# has to earn the right to block. Run it in monitor mode until its
# false-positive rate is known, then tighten.
#
# Layering: defaults < this file < environment < command line. Security-relevant
# settings may only be restricted by later layers, never relaxed. An environment
# variable must not be able to downgrade enforce mode to monitor, since the
# environment is what a compromised agent is best positioned to influence.

daemon:
  socket_path: /run/allseer/allseerd.sock
  # Socket permissions are the primary access control. Anyone who can write to
  # this socket can create sessions, and therefore define what an agent may do.
  socket_mode: 0660
  state_dir: /var/lib/allseer
  max_concurrent_sessions: 8
  shutdown_grace: 30s
  # eBPF loading needs CAP_BPF and CAP_SYS_ADMIN; steady-state operation does
  # not. Keeping them after attach is an unnecessary standing risk.
  #
  # Not implemented in this build: the daemon stays root for its lifetime.
  # Setting either of these is refused at startup rather than ignored, so a
  # deployment cannot believe privileges were dropped when they were not.
  drop_privileges: false
  # run_as_user: allseer

telemetry:
  object_path: /usr/lib/allseer/allseer.bpf.o
  # Must be a power-of-two multiple of the page size. Larger buffers tolerate
  # consumer stalls at the cost of locked memory.
  ring_buffer_size: 16777216
  event_channel_size: 16384
  # Empty means attach everything. Narrowing this is the main lever for reducing
  # overhead, paid for in blind spots. File opens (openat or file_open) and
  # connects (connect or socket_connect) must stay: without them the daemon
  # refuses to start.
  enabled_probes: []
  enable_binary_hashing: false
  # Not implemented in this build: there is no DNS correlator, so a grant that
  # names a hostname cannot match and connections reach policy by address.
  enable_dns_correlation: false
  # A gap in telemetry means the system can no longer make sound statements
  # about what the agent did, including "nothing bad happened". Halting is the
  # honest response, and also the disruptive one.
  fail_closed_on_drop: true

intent:
  # "rules" is deterministic and offline. "llm" is more accurate on novel
  # phrasing. "hybrid" runs both and takes the intersection.
  #
  # Only "rules" is built. The LLM analyzer is deferred, so "llm" or "hybrid"
  # would still run the rule analyzer and the file would be claiming otherwise.
  analyzer: rules
  timeout: 20s
  fallback_to_rules: true
  # Removes invisible and direction-changing characters before analysis and
  # flags text addressed to the governor ("ignore previous instructions").
  # Flags appear as ambiguities on the envelope for the person approving it;
  # the recorded prompt stays verbatim.
  enable_sanitizer: true
  # Keep the prompt verbatim in the envelope, the session and the audit log.
  # Off: the prompt is analyzed in memory and dropped once the envelope is
  # generated, since it can hold anything a user pasted into it.
  retain_prompt: false
  llm:
    provider: anthropic
    model: claude-sonnet-5
    # The key itself is never stored in config, so this file can be committed
    # and shared without leaking credentials.
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096
    timeout: 15s
    max_retries: 2

envelope:
  profile_dir: /etc/allseer/profiles
  require_approval: true
  # The setting most likely to quietly disable the human-in-the-loop guarantee.
  # Zero disables auto-approval entirely; raise it only once envelope quality is
  # measured rather than assumed.
  auto_approve_below_risk: 0
  default_ttl: 1h
  # An envelope with fifty grants is not meaningfully constraining anything.
  max_grants: 32

risk:
  # Empty means all registered scorers.
  enabled_scorers: []
  # Keys are factor names as internal/risk emits them. Names that do not match a
  # shipped factor are inert, which is why this list tracks the scorer set: it
  # was written against the planned names and several of those changed as the
  # scorers were built. Every name below now matches a shipped factor.
  #
  # privilege_change's own weight is already the capability catalog's grade for
  # the kind — critical for priv.escalate, priv.setuid, priv.capset and
  # priv.namespace, high for priv.seccomp — so a multiplier here scales a number
  # the catalog chose. Raising it above 1.0 is a deployment saying its agents
  # have even less business changing privilege than the catalog assumes.
  scorer_weights:
    sensitive_path: 1.0
    sensitive_host: 1.0
    uncorrelated_destination: 1.0
    credential_access_egress: 2.0
    workspace_escape: 0.8
    novel_target: 0.6
    violation_history: 0.6
    privilege_change: 1.5
  # Deployment-specific additions to the built-in list.
  sensitive_paths:
    - /etc/shadow
    - /etc/sudoers
    - ~/.ssh/**
    - ~/.aws/**
    - ~/.kube/config
    - "**/.env"
    - "**/.env.*"
  # Both lists are deployment-specific *additions*. The shipped baseline lives
  # in configs/sensitivity.default.yaml, which has a `paths` section and a
  # `hosts` section; host patterns follow devdocs/network-matching.md's vocabulary
  # and are not filesystem globs.
  sensitive_hosts: []
  thresholds:
    low: 20
    medium: 45
    high: 70
    critical: 90
  # Baselines are valuable for the research contribution but add a poisoning
  # surface: an attacker who can shape the baseline can normalize their own
  # behavior. Off until that is addressed.
  enable_baseline: false

policy:
  rule_set_path: /etc/allseer/rules.yaml
  # interactive freezes the agent on a risky action and asks its owner on the
  # terminal or through `allseerctl approve`. Use monitor to evaluate (records,
  # never interrupts) and enforce for unattended runs and CI (kills where
  # interactive would ask). A session can ask for a stricter mode, never a
  # weaker one, so monitor has to be chosen here or with allseerd --mode.
  default_mode: interactive
  hot_reload: true
  approval_timeout: 5m
  # "deny" is the safe default, but a deny-on-timeout firing while the user is
  # at lunch kills long-running tasks. A genuine tradeoff to make consciously.
  approval_timeout_action: deny

audit:
  path: /var/lib/allseer/audit.jsonl
  format: jsonl
  # Expensive, but necessary for research analysis and replay-based development.
  record_all_events: false
  # Rotate before the log passes this size, keeping max_files rotated files
  # (audit.jsonl.1 is the newest) and deleting the oldest. max_size_mb 0
  # switches rotation off; max_files 0 keeps every rotated file.
  max_size_mb: 100
  max_files: 10
  # Not implemented in this build: rotated files are kept by count, not age.
  retention_days: 0
  # Without this, a crash loses exactly the records most likely to matter.
  sync_writes: true

# Diagnostics only; decisions go to the audit log. level is debug, info, warn
# or error; format is text or json; output is stderr, stdout or an absolute
# path, created 0600 and appended to. Every record is redacted before it is
# written: fields named like secrets are dropped and credential shapes are
# removed from every value. Paths are kept, because they are the findings.
logging:
  level: info
  format: text
  output: stderr
  add_source: false
