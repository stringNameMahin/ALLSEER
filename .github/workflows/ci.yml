# ALLSEER continuous integration.
#
# Every job runs one `make ci-*` target, so `make ci` reproduces the pipeline
# locally. Tool versions are pinned in scripts/ci/versions.env.

name: CI

on:
  push:
    branches: [stable, dev, experimental]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/versions.env', 'scripts/ci/tools.sh', 'go.mod') }}
      - run: make ci-lint

  static:
    name: Static analysis
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libelf-dev zlib1g-dev python3-venv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/versions.env', 'scripts/ci/tools.sh', 'go.mod') }}
      - run: make ci-static

  # No expression in the name: GitHub appends the matrix value, so the job
  # shows as "Build (amd64)" when it runs and plain "Build" when skipped.
  build:
    name: Build
    needs: static
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # arm64 is real coverage: syscall tables and __TARGET_ARCH are per-arch.
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang llvm libelf-dev zlib1g-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/versions.env', 'scripts/ci/tools.sh', 'go.mod') }}
      - run: make ci-build
      - name: Package build outputs
        run: >-
          tar -cf build-${{ matrix.arch }}.tar
          bin/allseerd bin/allseerctl bin/allseer-shim bin/allseerd-ebpf
          bin/ci/telemetry-ebpf.test bpf/allseer.bpf.o
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.arch }}
          path: build-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-amd64
      # With the object present, the layout test runs instead of skipping.
      - run: tar -xf build-amd64.tar bpf/allseer.bpf.o
      - run: make ci-unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-coverage
          path: |
            bin/ci/coverage.out
            bin/ci/coverage.txt
            bin/ci/coverage.html
            bin/ci/unit.json
          retention-days: 14

  integration:
    name: Integration
    needs: [build, unit]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.arch }}
      - run: tar -xf build-${{ matrix.arch }}.tar
      # Loading probes needs root, kernel BTF and cgroup v2. Hosted runners are
      # full VMs with passwordless sudo, so the suite runs rather than skips.
      - name: Runner kernel features
        run: |
          uname -r
          test -f /sys/kernel/btf/vmlinux && echo "kernel BTF: present"
          echo "cgroup fs: $(stat -fc %T /sys/fs/cgroup)"
      - run: make ci-integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-${{ matrix.arch }}
          path: |
            bin/ci/integration.json
            bin/ci/integration-coverage.out
            bin/ci/integration-coverage.txt
          retention-days: 14

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libelf-dev zlib1g-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-security-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/versions.env', 'scripts/ci/tools.sh', 'go.mod') }}
      - run: make ci-security
