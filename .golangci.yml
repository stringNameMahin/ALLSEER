# golangci-lint configuration.
#
# The linter set is deliberately the standard one. CI enforces correctness
# rather than style: gofmt already settles formatting, and a gate that fires on
# opinions is a gate people learn to ignore.

version: "2"

linters:
  default: standard

  settings:
    errcheck:
      # Writing to stdout, stderr or a tabwriter cannot usefully fail, and a
      # deferred Close on an os.File is the idiom for a handle the caller is
      # finished with. Everything else stays checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close

    staticcheck:
      checks:
        - all
        # QF1001 rewrites a negated conjunction through De Morgan's law. The
        # negated form states the expected ordering directly and reads better
        # where it is used here.
        - -QF1001

  exclusions:
    # golangci-lint applies these by default. Declaring any exclusions replaces
    # that default, so they are restated rather than lost.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # A deferred Close in a test closes a fixture the test is done with. A
      # failure there cannot change the result.
      - path: _test\.go
        linters:
          - errcheck
